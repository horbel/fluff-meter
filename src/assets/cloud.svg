<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 120 120">
  <title>Fluff Meter</title>
  <!-- The small version: 16/32px toolbar and the fold bar. Bigger cloud, two bold sparkles that survive at 16px. icon.svg is the detailed one: keep the two in sync. -->
  <defs>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="108">
      <stop offset="0" stop-color="#d9c8ff"/>
      <stop offset="1" stop-color="#b294f7"/>
    </linearGradient>
    <g id="lumps">
      <circle cx="40" cy="62" r="22"/>
      <circle cx="64" cy="46" r="28"/>
      <circle cx="89" cy="60" r="21"/>
      <circle cx="98" cy="82" r="16"/>
      <circle cx="30" cy="82" r="16"/>
      <rect x="26" y="62" width="76" height="46" rx="22"/>
    </g>
    <clipPath id="eye-l"><ellipse cx="51" cy="75" rx="9" ry="7.5"/></clipPath>
    <clipPath id="eye-r"><ellipse cx="77" cy="75" rx="9" ry="7.5"/></clipPath>
  </defs>
  <g transform="translate(66 70) scale(0.8999999999999999) translate(-64 -63)">
  <!-- Outline: the same lumps drawn fatter underneath, so only the outer edge shows. -->
  <use href="#lumps" fill="#4b2fa8" stroke="#4b2fa8" stroke-width="10" stroke-linejoin="round"/>
  <use href="#lumps" fill="url(#fill)"/>
  <!-- A soft highlight on the biggest lump. -->
  <ellipse cx="55" cy="33" rx="11" ry="5.5" fill="#fff" opacity="0.55" transform="rotate(-20 55 33)"/>
  <!-- Eyes rolled up to the sky, as in "oh, come on". -->
  <ellipse cx="51" cy="75" rx="9" ry="7.5" fill="#fff"/>
  <ellipse cx="77" cy="75" rx="9" ry="7.5" fill="#fff"/>
  <circle cx="54" cy="68.5" r="5.5" fill="#2e1d6b" clip-path="url(#eye-l)"/>
  <circle cx="80" cy="68.5" r="5.5" fill="#2e1d6b" clip-path="url(#eye-r)"/>
  <!-- Heavy upper lids. -->
  <path d="M41.5 73.5 Q51 64 60.5 73.5 M67.5 73.5 Q77 64 86.5 73.5" fill="none" stroke="#2e1d6b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- A tired, flat mouth. -->
  <path d="M58 92 Q64 90 70 92" fill="none" stroke="#2e1d6b" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="37" cy="88" rx="6.5" ry="4" fill="#ff8fc4" opacity="0.7"/>
  <ellipse cx="91" cy="88" rx="6.5" ry="4" fill="#ff8fc4" opacity="0.7"/>
  </g>
  <!-- Sparkles, scattered on purpose: big on the left, small top right. -->
  <path transform="rotate(-10 17 64)" d="M17 49 Q20.3 60.7 32 64 Q20.3 67.3 17 79 Q13.7 67.3 2 64 Q13.7 60.7 17 49 Z" fill="#ffd24d" stroke="#4b2fa8" stroke-width="4.2" stroke-linejoin="round"/>
  <path transform="rotate(12 108 18)" d="M108 7 Q110.42 15.58 119 18 Q110.42 20.42 108 29 Q105.58 20.42 97 18 Q105.58 15.58 108 7 Z" fill="#ffd24d" stroke="#4b2fa8" stroke-width="3.1" stroke-linejoin="round"/>
</svg>
