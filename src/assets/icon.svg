<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <title>Fluff Meter</title>
  <defs>
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="0" y1="18" x2="0" y2="108">
      <stop offset="0" stop-color="#d9c8ff"/>
      <stop offset="1" stop-color="#b294f7"/>
    </linearGradient>
    <g id="cloud">
      <circle cx="38" cy="66" r="22"/>
      <circle cx="64" cy="48" r="29"/>
      <circle cx="92" cy="62" r="21"/>
      <circle cx="104" cy="84" r="16"/>
      <circle cx="24" cy="86" r="15"/>
      <rect x="22" y="66" width="86" height="40" rx="20"/>
    </g>
  </defs>
  <!-- Outline: the same lumps drawn fatter underneath, so only the outer edge shows. -->
  <use href="#cloud" fill="#4b2fa8" stroke="#4b2fa8" stroke-width="10" stroke-linejoin="round"/>
  <use href="#cloud" fill="url(#fill)"/>
  <!-- A soft highlight on the biggest lump. -->
  <ellipse cx="54" cy="36" rx="12" ry="6" fill="#fff" opacity="0.55" transform="rotate(-20 54 36)"/>
  <!-- Eyes rolled up to the sky: "and there was so much talk". -->
  <clipPath id="eye-l"><ellipse cx="50" cy="75" rx="9.5" ry="7.5"/></clipPath>
  <clipPath id="eye-r"><ellipse cx="79" cy="75" rx="9.5" ry="7.5"/></clipPath>
  <ellipse cx="50" cy="75" rx="9.5" ry="7.5" fill="#fff"/>
  <ellipse cx="79" cy="75" rx="9.5" ry="7.5" fill="#fff"/>
  <circle cx="53" cy="68.5" r="5.5" fill="#2e1d6b" clip-path="url(#eye-l)"/>
  <circle cx="82" cy="68.5" r="5.5" fill="#2e1d6b" clip-path="url(#eye-r)"/>
  <!-- Heavy upper lids. -->
  <path d="M40 73.5 Q50 64 60 73.5 M69 73.5 Q79 64 89 73.5" fill="none" stroke="#2e1d6b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- A tired, flat mouth. -->
  <path d="M59 92 Q65 90 71 92" fill="none" stroke="#2e1d6b" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="36" cy="88" rx="7" ry="4" fill="#ff8fc4" opacity="0.7"/>
  <ellipse cx="94" cy="88" rx="7" ry="4" fill="#ff8fc4" opacity="0.7"/>
</svg>
