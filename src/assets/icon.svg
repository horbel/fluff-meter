<circle cx="98" cy="82" r="16"/><circle cx="30" cy="82" r="16"/><rect x="26" y="62" width="76" height="46" rx="22"/></g><ellipse cx="55" cy="33" rx="11" ry="5.5" fill="#fff" opacity="0.55" transform="rotate(-20 55 33)"/><g transform="rotate(8 64 82)">
