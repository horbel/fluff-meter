  <!-- The cloud as Ariadne in the meme (Guido Reni, "Bacchus and Ariadne"): head tilted, eyes
       rolled up and to the right, lips parted. -->
  <g transform="translate(64 70) scale(0.82) translate(-64 -63)">
  <g fill="#4b2fa8" stroke="#4b2fa8" stroke-width="10" stroke-linejoin="round"><circle cx="40" cy="62" r="22"/><circle cx="64" cy="46" r="28"/><circle cx="89" cy="60" r="21"/>
