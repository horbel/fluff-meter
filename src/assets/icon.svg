<ellipse cx="51" cy="76" rx="9.5" ry="8" fill="#fff"/><ellipse cx="78" cy="76" rx="9.5" ry="8" fill="#fff"/>
<circle cx="55.5" cy="69.5" r="5.6" fill="#2e1d6b" clip-path="url(#el)"/><circle cx="82.5" cy="69.5" r="5.6" fill="#2e1d6b" clip-path="url(#er)"/>
