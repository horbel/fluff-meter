name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run zip
      - name: Attach the zip to a GitHub release
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
