name: Bug
description: Something else is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Demo (no key), TypeSafe key, OpenRouter key]
  - type: input
    id: version
    attributes:
      label: Extension and Chrome version
